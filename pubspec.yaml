name: lensguard
description: A smart assistant app for contact lens wearers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1
  firebase_crashlytics: ^5.0.7
  firebase_analytics: ^12.1.1
  firebase_performance: ^0.11.1+4

  # Google Sign In
  google_sign_in: ^6.2.1

  # Local Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # State Management
  provider: ^6.1.1

  # UI
  cupertino_icons: ^1.0.6
  
  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/

  # Fonts (optional)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
